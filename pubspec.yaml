name: pontis
description: "A crash-course travel language learning mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Spaced repetition scheduling engine (SRS §3.2.1)
  fsrs: ^2.0.1
  # Cloud backend, auth, and database client (SRS §3.1.3, §3.4.1)
  supabase_flutter: ^2.8.0
  # Secure local credential storage (SRS §3.2.5.3)
  flutter_secure_storage: ^9.2.2
  # Audio playback for pronunciation models and tests (SRS §3.1.3, §3.3)
  audioplayers: ^6.1.0
  # Speech recognition interface
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test coverage reporting
  coverage: ^1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/models/
